<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Typing Speed Test</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles.css">

  <script src="src/main.js" type="module" defer></script>
  <script src="src/dataRepository.js" type="module" defer></script>
</head>

<body>
  <div class="content" id="content">
    <div>
      <header aria-labelledby="title">
        <h1 id="title" class="sr-only">Typing Speed Test</h1>
        <img src="assets/images/logo-small.svg" alt="">
        <div class="personal-best">
          <img src="assets/images/icon-personal-best.svg" alt="">
          <p class="personal-best">Personal best:<span id="personal-best-value"></span></p>
        </div>
      </header>

      <section class="statistics" aria-label="Statistics" id="statistics">
        <p>WPM: <span id="wpm-value"></span></p>
        <p>Accuracy: <span id="accuracy-value"></span></p>
        <p>Time: <span id="time-value"></span></p>
      </section>

      <section class="options" aria-label="Options" id="options">
        <div class="option">
          <label for="difficulty" class="sr-only">Difficulty:</label>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="option">
          <label for="mode" class="sr-only">Mode:</label>
          <select id="mode">
            <option value="passage" selected>Passage</option>
            <option value="15">15s</option>
            <option value="30">30s</option>
            <option value="60">60s</option>
            <option value="120">120s</option>
          </select>
        </div>
      </section>
    </div>

    <div class="content-bottom" id="content-bottom">
      <section id="start-section" class="start-section" aria-labelledby="start-btn">
        <button class="start-btn" type="button" id="start-btn">Start Typing Test</button>
        <p>Or click the text and start typing</p>
      </section>
      <div class="text-to-type-section">
        <div class="text-to-type-with-input" id="text-to-type-with-input">
          <p id="text-to-type" class="text-to-type">
          </p>
          <input aria-label="Type: " class="text-to-type-input" id="text-to-type-input">
        </div>
        <div id="text-to-type-restart-section" class="text-to-type-restart-section">
          <button type="button" id="restart-test-btn">Restart Test ⟲</button>
        </div>
      </div>
    </div>
  </div>


  <section class="test-complete-section" aria-labelledby="test-complete" id="test-complete-section">
    <div>
      <img src="assets/images/icon-completed.svg" alt="" id="icon-completed" class="test-complete-icon">
      <img src="assets/images/icon-new-pb.svg" alt="" id="icon-new-personal-best" class="test-complete-icon">
      <img src="assets/images/pattern-star-2.svg" alt="" id="star-top">
    </div>
    <h2 class="title" id="test-complete-title">Test Complete!</h2>
    <p class="description" id="test-complete-description"></p>

    <div class="test-complete-results">
      <div class="test-complete-result">
        <p>WPM:</p>
        <p id="test-complete-wpm-value" class="value"></p>
      </div>
      <div class="test-complete-result">
        <p>Accuracy:</p>
        <p id="test-complete-accuracy-value" class="value"></p>
      </div>
      <div class="test-complete-result">
        <p>Characters:</p>
        <p class="value">
          <span id="test-complete-characters-correct"></span>/
          <span id="test-complete-characters-wrong"></span>
        </p>
      </div>
    </div>

    <div>
      <button type="button" id="go-again-btn" class="go-again-btn">Go Again ⟲</button>
    </div>

    <div>
      <img src="assets/images/pattern-star-1.svg" alt="" id="star-bottom">
    </div>
    <div>
      <img src="assets/images/pattern-confetti.svg" alt="" id="confetti">
    </div>
  </section>

</body>

</html>
