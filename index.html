<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Typing Speed Test</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles.css">

  <script src="src/main.js" type="module" defer></script>
</head>

<body>
  <header aria-labelledby="title">
    <h1 id="title" class="sr-only">Typing Speed Test</h1>
    <img src="assets/images/logo-small.svg" alt="">
    <div class="personal-best">
      <img src="assets/images/icon-personal-best.svg" alt="">
      <p class="personal-best">Personal best:<span id="personal-best-value"> 3 WPM</span></p>
    </div>
  </header>

  <section aria-label="Statistics">
    <p>WPM: <!-- WPM --></p>
    <p>Accuracy: <!-- Accuracy --></p>
    <p>Time: <!-- Time --></p>
  </section>

  <section aria-label="Options">
    <div>
      <label for="difficulty">Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
    <div>
      <label for="mode">Mode:</label>
      <select id="mode">
        <option value="passage" selected>Passage</option>
        <option value="15s">15s</option>
        <option value="30s">30s</option>
        <option value="60s">60s</option>
        <option value="120s">120s</option>
      </select>
    </div>
  </section>

  <section aria-labelledby="start-btn">
    <button type="button" id="start-btn">Start Typing Test</button>
    <p>Or click the text and start typing</p>
  </section>

  <section aria-labelledby="test-complete">
    <h2 id="test-complete">Test Complete!</h2>
    <p>Solid run. Keep pushing to beat your high score.</p>

    <div>
      <p>WPM:</p>
      <p></p>
    </div>
    <div>
      <p>Accuracy:</p>
      <p></p>
    </div>
    <div>
      <p>Characters:</p>
      <p></p>
    </div>

    <button type="button" id="go-again-btn">Go Again</button>
  </section>

</body>

</html>
