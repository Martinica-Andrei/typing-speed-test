<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Typing Speed Test</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="src/styles.css">

  <script src="src/main.js" type="module" defer></script>
  <script src="src/dataRepository.js" type="module" defer></script>
</head>

<body>
  <div class="content">
    <div>
      <header aria-labelledby="title">
        <h1 id="title" class="sr-only">Typing Speed Test</h1>
        <img src="assets/images/logo-small.svg" alt="">
        <div class="personal-best">
          <img src="assets/images/icon-personal-best.svg" alt="">
          <p class="personal-best">Personal best:<span id="personal-best-value"></span></p>
        </div>
      </header>

      <section class="statistics" aria-label="Statistics">
        <p>WPM: <span id="wpm-value"></span></p>
        <p>Accuracy: <span id="accuracy-value"></span></p>
        <p>Time: <span id="time-value"></span></p>
      </section>

      <section class="options" aria-label="Options">
        <div class="option">
          <label for="difficulty" class="sr-only">Difficulty:</label>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="option">
          <label for="mode" class="sr-only">Mode:</label>
          <select id="mode">
            <option value="passage" selected>Passage</option>
            <option value="15">15s</option>
            <option value="30">30s</option>
            <option value="60">60s</option>
            <option value="120">120s</option>
          </select>
        </div>
      </section>
    </div>

    <div class="content-bottom">
      <section class="start-section" aria-labelledby="start-btn">
        <button class="start-btn" type="button" id="start-btn">Start Typing Test</button>
        <p>Or click the text and start typing</p>
      </section>
      <p id="text-to-type" class="text-to-type"></p>
    </div>
  </div>


  <section class="test-complete-section" aria-labelledby="test-complete">
    <h2 id="test-complete">Test Complete!</h2>
    <p>Solid run. Keep pushing to beat your high score.</p>

    <div>
      <p>WPM:</p>
      <p></p>
    </div>
    <div>
      <p>Accuracy:</p>
      <p></p>
    </div>
    <div>
      <p>Characters:</p>
      <p></p>
    </div>

    <button type="button" id="go-again-btn">Go Again</button>
  </section>

</body>

</html>
